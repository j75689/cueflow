# Builds CueFlow's SearXNG image (deploy/searxng/Dockerfile) and pushes it to GitHub Packages
# (ghcr.io/j75689/cueflow-searxng). Cloud Run pulls it through an Artifact Registry remote
# repository, which can only read PUBLIC packages: after the first push, set the package to public
# in GitHub (Packages -> cueflow-searxng -> Package settings -> Change visibility). The image is
# the stock SearXNG plus a settings file, no secrets.
#
# It also rebuilds on demand (workflow_dispatch) to pick up a newer searxng/searxng:latest.
name: searxng-image

on:
  push:
    branches: [main]
    paths: ["deploy/searxng/**", ".github/workflows/searxng-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-searxng
          tags: |
            type=ref,event=branch
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: deploy/searxng
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
