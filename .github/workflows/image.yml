# Builds the container images on GitHub's runners and pushes them to GitHub Packages
# (ghcr.io/<owner>/cueflow). Cloud Run pulls the slim image through an Artifact Registry remote repository
# (see deploy/cloudrun/README.md), which can only read PUBLIC packages: after the first push, set the
# package to public in GitHub (Packages -> cueflow -> Package settings -> Change visibility).
# The images hold the compiled server and dashboard, no secrets.
#
# It runs for release tags (v1.2.3, created by release.yml) and by hand (Actions -> image -> Run workflow,
# on a branch for a test build, or on a tag to rebuild a release). Pushes to main build nothing.
#
# Tags, all in the one package (deployments pin the slim ones: keep them slim only):
#              release v1.2.3                  manual run on a branch
#   slim       1.2.3, latest                   <branch>, sha-<commit>
#   agents     1.2.3-agents, agents            <branch>-agents, sha-<commit>-agents
#   runner     1.2.3-runner, runner            <branch>-runner, sha-<commit>-runner
# `latest`, `agents` and `runner` follow the newest release.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Each target queues behind its own previous build of the same ref only, in order, so a slow build
    # cannot finish after a newer one and move a tag back. The targets build in parallel, so slim (what
    # deployments pull) never waits for the emulated arm64 builds.
    concurrency:
      group: image-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # The slim target is the last stage of the Dockerfile (no agent CLIs: the cloud runs agents
          # on runners). amd64 only: it is what Cloud Run runs.
          - target: slim
            suffix: ""
            platforms: linux/amd64
          # agents and runner also run on arm64 machines (a Mac with Docker, a Raspberry Pi).
          - target: agents
            suffix: -agents
            platforms: linux/amd64,linux/arm64
          - target: runner
            suffix: -runner
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ matrix.target == 'slim' && 'auto' || 'false' }}
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ matrix.target }},suffix=,enable=${{ matrix.target != 'slim' && startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
