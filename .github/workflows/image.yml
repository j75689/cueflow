# Builds the container images on GitHub's runners and pushes them to GitHub Packages
# (ghcr.io/<owner>/cueflow). Cloud Run pulls the slim image through an Artifact Registry remote repository
# (see deploy/cloudrun/README.md), which can only read PUBLIC packages: after the first push, set the
# package to public in GitHub (Packages -> cueflow -> Package settings -> Change visibility).
# The images hold the compiled server and dashboard, no secrets.
#
# Tags, all in the one package:
#   slim     main, 1.2.3, latest, sha-<commit>            (deployments pin these: keep them slim only)
# sha-<commit> tags are pushed from branch builds only, so a release tag on the same commit does not rebuild them.
#   agents   agents, main-agents, 1.2.3-agents, sha-<commit>-agents
#   runner   runner, main-runner, 1.2.3-runner, sha-<commit>-runner
# `agents` and `runner` follow main.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per ref at a time, in order: a slow run finishing after a newer one would move `runner`,
# `agents` and `main` back to the older commit.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The slim target is the last stage of the Dockerfile (no agent CLIs: the cloud runs agents
          # on runners). amd64 only: it is what Cloud Run runs.
          - target: slim
            suffix: ""
            platforms: linux/amd64
          # agents and runner also run on arm64 machines (a Mac with Docker, a Raspberry Pi).
          - target: agents
            suffix: -agents
            platforms: linux/amd64,linux/arm64
          - target: runner
            suffix: -runner
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ matrix.target == 'slim' && 'auto' || 'false' }}
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ matrix.target }},suffix=,enable=${{ matrix.target != 'slim' && github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
