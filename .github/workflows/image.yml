# Builds the container images on GitHub's runners and pushes them to GitHub Packages
# (ghcr.io/<owner>/cueflow). Cloud Run pulls the slim image through an Artifact Registry remote repository
# (see deploy/cloudrun/README.md), which can only read PUBLIC packages: after the first push, set the
# package to public in GitHub (Packages -> cueflow -> Package settings -> Change visibility).
# The images hold the compiled server and dashboard, no secrets.
#
# It runs for release tags (v1.2.3, created by release.yml) and by hand (Actions -> image -> Run workflow,
# on a branch for a test build, or on a tag to rebuild a release). Pushes to main build nothing.
#
# Tags, all in the one package (deployments pin the slim ones: keep them slim only):
#              release v1.2.3                  manual run on a branch
#   slim       1.2.3, latest                   <branch>, sha-<commit>
#   agents     1.2.3-agents, agents            <branch>-agents, sha-<commit>-agents
#   runner     1.2.3-runner, runner            <branch>-runner, sha-<commit>-runner
# `latest`, `agents` and `runner` follow the newest stable release. The last step moves them, and only
# when the tag being built is that release: a rebuild of an old tag or a prerelease leaves them alone.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Each target queues behind its own previous build of the same ref, so a rerun never races itself, and
    # no release is skipped for another. Builds of different tags run in parallel: which release the moving
    # tags follow is decided after the build (last step), not by whichever build finishes last. The targets
    # build in parallel too, so slim (what deployments pull) never waits for the emulated arm64 builds.
    concurrency:
      group: image-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # The slim target is the last stage of the Dockerfile (no agent CLIs: the cloud runs agents
          # on runners). amd64 only: it is what Cloud Run runs.
          - target: slim
            suffix: ""
            moving: latest
            platforms: linux/amd64
          # agents and runner also run on arm64 machines (a Mac with Docker, a Raspberry Pi).
          - target: agents
            suffix: -agents
            moving: agents
            platforms: linux/amd64,linux/arm64
          - target: runner
            suffix: -runner
            moving: runner
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      # The moving tag follows the newest stable release, decided here against the repository's tags once
      # the build is done: a release whose build finished after a newer one, a rebuild of an old tag by
      # hand, or a prerelease (v1.2.3-rc.1) leaves it where it is. Moving the tag copies the manifest just
      # pushed; nothing is rebuilt.
      - name: Move ${{ matrix.moving }} to this release if it is the newest
        if: github.ref_type == 'tag'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MOVING: ${{ matrix.moving }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          newest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk -F/ '$NF !~ /-/ {print $NF}' | sort -V | tail -n1)
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest stable release (${newest:-none yet}); $MOVING stays where it is"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:$MOVING" "$IMAGE:${TAG#v}$SUFFIX"
