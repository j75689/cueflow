name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, so a new advisory is noticed without waiting for a change

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cueflow
          POSTGRES_PASSWORD: cueflow
          POSTGRES_DB: cueflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cueflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go.mod / go.sum must be exactly what tidy produces; a hand-edited bump that leaves go.sum
      # stale would otherwise pass until someone ran tidy locally.
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          CUEFLOW_TEST_DATABASE_URL: postgres://cueflow:cueflow@localhost:5432/cueflow?sslmode=disable

  # Known vulnerabilities reachable from this code (symbol level, so an advisory in a function the
  # binary never calls does not fail the build). The scanner is always the latest: it is the database
  # that matters, not the pinned tool.
  vulns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cueflow:slim .
      - run: docker build --target agents -t cueflow:agents .

  # Nothing that belongs to the maintainer's own deployment (project ids, private repositories,
  # in-house services) may be named in the public tree. Generic words live in the script; the
  # PRIVATE_REF_WORDS repository variable adds the ones that must not appear in the tree themselves.
  private-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-no-private-refs.sh
        env:
          PRIVATE_REF_WORDS: ${{ vars.PRIVATE_REF_WORDS }}

  # Secret scan over the whole history, not just the diff: a key removed in a later commit is still
  # in the clone. (gitleaks-action is free for repositories owned by a user account; an organization
  # needs GITLEAKS_LICENSE.)
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # on a pull request the action lists its commits through the API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
