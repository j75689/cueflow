# CueFlow on one host. Every port is bound to 127.0.0.1 (no public exposure); reach it from other
# machines through an SSH tunnel or a VPN such as Tailscale.
#
#   cd deploy
#   cp .env.example .env    # then fill in CUEFLOW_SECRET_KEY, SEARXNG_SECRET, ...
#   docker compose up -d                 # CueFlow + PostgreSQL + SearXNG
#   docker compose --profile mock up -d  # also start a mock publisher, to try the flow without posting anywhere
#
# CueFlow:  http://localhost:3000
# SearXNG:  http://localhost:8888   (web search for agents; connector URL http://searxng:8080)
# Publishing goes through an MCP server that follows docs/publisher-mcp.md: add it as an
# "MCP publisher" connector in CueFlow (or the mock below).

name: cueflow

x-postgres-health: &pg-health
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ---------------------------------------------------------------- CueFlow
  cueflow:
    # Image: slim (default) | agents (Claude Code/Codex ACP adapters).
    build:
      context: ..
      dockerfile: Dockerfile
      target: ${CUEFLOW_IMAGE_TARGET:-slim}
    image: cueflow:${CUEFLOW_IMAGE_TARGET:-slim}
    restart: unless-stopped
    depends_on:
      cueflow-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cueflow:${CUEFLOW_DB_PASSWORD:-cueflow}@cueflow-db:5432/cueflow?sslmode=disable
      CUEFLOW_SECRET_KEY: ${CUEFLOW_SECRET_KEY:?set CUEFLOW_SECRET_KEY in .env (openssl rand -base64 32)}
      CUEFLOW_SECRET_KEY_PREVIOUS: ${CUEFLOW_SECRET_KEY_PREVIOUS:-}
      CUEFLOW_ADMIN_TOKEN: ${CUEFLOW_ADMIN_TOKEN:-}
      CUEFLOW_MCP_TOKEN: ${CUEFLOW_MCP_TOKEN:-}
      CUEFLOW_PUBLIC_URL: ${CUEFLOW_PUBLIC_URL:-http://localhost:3000}
      # Where publishers fetch media stored in CueFlow; a publisher in this compose file reaches CueFlow by its service name.
      CUEFLOW_MEDIA_BASE_URL: ${CUEFLOW_MEDIA_BASE_URL:-http://cueflow:3000}
      # Empty keeps media in the database; file:///data/media keeps it on disk (mount a volume there).
      CUEFLOW_MEDIA_STORAGE: ${CUEFLOW_MEDIA_STORAGE:-}
      CUEFLOW_DIGEST_CRON: ${CUEFLOW_DIGEST_CRON:-}
      TZ: ${TZ:-UTC}
      # Server-wide LLM credentials, used by connectors whose own credential fields are blank.
      # Claude API: API key, OAuth/Bearer token, or a profile from a mounted `ant` config (below).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_PROFILE: ${ANTHROPIC_PROFILE:-}
      # Claude on Bedrock: default AWS credential chain.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      # Claude/Gemini on Vertex AI: Application Default Credentials (mount gcloud config or a key file below).
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    # Optional credential files (the container runs as user "nonroot", HOME=/home/nonroot):
    # volumes:
    #   - ~/.config/anthropic:/home/nonroot/.config/anthropic:ro   # `ant auth login` profiles
    #   - ~/.aws:/home/nonroot/.aws:ro                              # AWS shared config/credentials
    #   - ~/.config/gcloud:/home/nonroot/.config/gcloud:ro          # `gcloud auth application-default login` (Vertex)
    #   - ./gcp-sa.json:/secrets/gcp-sa.json:ro                     # then GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-sa.json
    ports:
      - "127.0.0.1:3000:3000"

  cueflow-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cueflow
      POSTGRES_PASSWORD: ${CUEFLOW_DB_PASSWORD:-cueflow}
      POSTGRES_DB: cueflow
    volumes:
      - cueflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cueflow -d cueflow"]
      <<: *pg-health

  # Optional publisher that posts nowhere, for trying CueFlow out. In CueFlow add an "MCP publisher"
  # connector with endpoint http://mock-publisher:4010/mcp and bearer token "dev-token"; received
  # posts are listed at http://localhost:4010/posts.
  mock-publisher:
    image: cueflow:${CUEFLOW_IMAGE_TARGET:-slim}
    profiles: ["mock"]
    entrypoint: ["/usr/local/bin/mock-publisher-mcp"]
    # The image's HEALTHCHECK probes CueFlow's API, which the mock does not serve.
    healthcheck:
      disable: true
    environment:
      MOCK_PUBLISHER_TOKEN: dev-token
    ports:
      - "127.0.0.1:4010:4010"

  # Self-hosted web search for agents. In CueFlow add a "SearXNG" connector with URL http://searxng:8080.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"

volumes:
  cueflow-db:
