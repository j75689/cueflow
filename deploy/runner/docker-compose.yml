# A CueFlow runner in a container: it works agents' tasks (Claude Code) with only the credentials
# in .env and a clean /work, never your own logins. See README.md next to this file.
#
#   cp .env.example .env            # fill it in
#   docker compose run --rm runner register --url https://<your CueFlow> --token cfreg_... --name docker-runner
#   docker compose up -d
#
# It runs the published image; `docker compose pull && docker compose up -d` updates it. To add tools, see
# docs/runner-image.md.
services:
  runner:
    image: ${CUEFLOW_RUNNER_IMAGE:-ghcr.io/j75689/cueflow:runner}
    # Working from source, or adding Debian packages: uncomment, then `docker compose up -d --build`.
    # build:
    #   context: ../..
    #   target: runner
    #   args:
    #     RUNNER_EXTRA_PACKAGES: ${RUNNER_EXTRA_PACKAGES:-} # e.g. "python3 ffmpeg"
    restart: unless-stopped
    env_file: .env
    environment:
      # This runner is for coding agents: they may run commands and edit files, in /work, inside this
      # container. Nothing outside the container is reachable; the credentials are the two in .env.
      CUEFLOW_RUNNER_ALLOW_SHELL: "true"
      GIT_AUTHOR_NAME: ${GIT_NAME:-CueFlow agent}
      GIT_COMMITTER_NAME: ${GIT_NAME:-CueFlow agent}
      GIT_AUTHOR_EMAIL: ${GIT_EMAIL:?set GIT_EMAIL in .env}
      GIT_COMMITTER_EMAIL: ${GIT_EMAIL:?set GIT_EMAIL in .env}
    volumes:
      - config:/config # runner.json: the credentials this runner got when it registered
      - work:/work     # what the agents clone and edit; `docker compose down -v` wipes it
      # Claude Code's managed settings: no "Co-Authored-By" on commits and no footer on pull requests.
      - ./claude-settings.json:/etc/claude-code/managed-settings.json:ro
    tmpfs:
      - /tmp
      - /home/nonroot:uid=65532,gid=65532,mode=0700 # Claude Code's own state, gone on restart
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    pids_limit: 512

volumes:
  config:
  work:
